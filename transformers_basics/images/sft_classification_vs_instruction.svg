<svg width="100%" viewBox="0 0 760 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Classification Fine-Tuning vs Instruction Fine-Tuning Architecture and Loss</title>
  <desc>Side-by-side comparison of Classification SFT (replaces LM head with class head, supervises only the last token) and Instruction SFT (keeps LM head, supervises response tokens and first EOS token while masking instruction and extra padding with -100).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="400" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Shared Pretrained Base -->
  <rect x="240" y="16" width="280" height="38" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
  <text x="380" y="35" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#334155">Pretrained Base LLM (d_model = 768)</text>

  <!-- Split Connectors -->
  <line x1="380" y1="54" x2="380" y2="68" stroke="#64748b" stroke-width="1.5"/>
  <line x1="190" y1="68" x2="570" y2="68" stroke="#64748b" stroke-width="1.5"/>
  <line x1="190" y1="68" x2="190" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="68" x2="570" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LEFT PANEL: Classification Fine-Tuning -->
  <rect x="20" y="88" width="340" height="294" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="88" width="340" height="34" rx="8" fill="#dbeafe"/>
  <text x="190" y="105" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">1. Classification SFT (Raschka Ch. 6)</text>

  <!-- Tokens in Classification -->
  <text x="40" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#475569">Input Tokens (Causal Attention → Last Token):</text>
  <rect x="40" y="152" width="58" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="69" y="165" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#475569">"Win"</text>
  <rect x="106" y="152" width="58" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="135" y="165" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#475569">"free"</text>
  <rect x="172" y="152" width="58" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="201" y="165" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" fill="#475569">"cash"</text>
  <rect x="238" y="152" width="96" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="286" y="165" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="11" font-weight="700" fill="#1e40af">"now" (t = -1)</text>

  <!-- Causal curve arrows into last token -->
  <path d="M69 178 Q177 204 282 180" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M135 178 Q210 198 284 180" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M201 178 Q242 192 285 180" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Ignored earlier hidden states vs Kept last hidden state -->
  <text x="118" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">h₀, h₁, h₂ ignored</text>
  <line x1="286" y1="178" x2="286" y2="232" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Replaced Output Head -->
  <rect x="40" y="236" width="300" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="190" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Replaced Classification Head</text>
  <text x="190" y="273" text-anchor="middle" font-family="monospace" font-size="11" fill="#1d4ed8">nn.Linear(768 → num_classes=2)</text>

  <line x1="190" y1="288" x2="190" y2="310" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loss Box -->
  <rect x="40" y="314" width="300" height="52" rx="6" fill="#1e3a8a"/>
  <text x="190" y="333" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Cross-Entropy on Last Token Only</text>
  <text x="190" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#93c5fd">F.cross_entropy(logits[:, -1, :], y_class)</text>

  <!-- RIGHT PANEL: Instruction Fine-Tuning -->
  <rect x="400" y="88" width="340" height="294" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="400" y="88" width="340" height="34" rx="8" fill="#d1fae5"/>
  <text x="570" y="105" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#065f46">2. Instruction SFT (Raschka Ch. 7)</text>

  <!-- Tokens in Instruction SFT -->
  <text x="420" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#475569">Shifted Target Positions (y = padded[1:]):</text>

  <!-- Masked Instruction -->
  <rect x="420" y="152" width="90" height="38" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3,2"/>
  <text x="465" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748b">Instruction</text>
  <text x="465" y="181" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#dc2626">y = -100</text>

  <!-- Active Response + 1st EOS -->
  <rect x="518" y="152" width="114" height="38" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="575" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#065f46">Response + 1st EOS</text>
  <text x="575" y="181" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#047857">y = [R₁, R₂, 50256]</text>

  <!-- Masked Padding -->
  <rect x="640" y="152" width="80" height="38" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3,2"/>
  <text x="680" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748b">Extra Pad</text>
  <text x="680" y="181" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#dc2626">y = -100</text>

  <!-- Arrows down from active response only -->
  <text x="465" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">0 grad</text>
  <line x1="575" y1="190" x2="575" y2="232" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="680" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">0 grad</text>

  <!-- Kept LM Output Head -->
  <rect x="420" y="236" width="300" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="570" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#065f46">Keeps Original Pretrained LM Head</text>
  <text x="570" y="273" text-anchor="middle" font-family="monospace" font-size="11" fill="#047857">nn.Linear(768 → vocab_size=50,257)</text>

  <line x1="570" y1="288" x2="570" y2="310" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loss Box -->
  <rect x="420" y="314" width="300" height="52" rx="6" fill="#065f46"/>
  <text x="570" y="333" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Token Cross-Entropy (ignore_index = -100)</text>
  <text x="570" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#a7f3d0">F.cross_entropy(logits.flatten(0,1), y.flatten())</text>
</svg>
