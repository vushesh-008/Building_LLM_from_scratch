<svg width="100%" viewBox="0 0 800 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>BERT Encoder-Only Architecture: Pre-Training vs Downstream Classification, NER, and Embeddings</title>
  <desc>Complete visual showing Phase 1 (BERT Pre-Training with [CLS] and [SEP], 3 summed input embeddings, bidirectional encoder stack, NSP head on h_0, and MLM head on masked tokens) and Phase 2 (discarding pre-training heads to use the encoder for Sequence Classification on [CLS], Token Classification/NER on all tokens, or Mean-Pooled Embeddings).</desc>
  <defs>
    <marker id="b-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="470" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e293b">Encoder-Only (BERT) Lifecycle: Self-Supervised Pre-Training → Downstream Adaptation</text>

  <!-- LEFT PANEL: PHASE 1 PRE-TRAINING -->
  <rect x="16" y="42" width="380" height="412" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="16" y="42" width="380" height="32" rx="8" fill="#dbeafe"/>
  <text x="206" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Phase 1: Self-Supervised Pre-Training (MLM + NSP)</text>

  <!-- Input Tokens Row (Bottom of Left Panel) -->
  <text x="206" y="438" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#475569">1. Input Pair with [CLS], [SEP], and 15% [MASK]:</text>
  <g font-family="monospace" font-size="10.5" text-anchor="middle">
    <rect x="28" y="394" width="52" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="54" y="412" font-weight="700" fill="#5b21b6">[CLS]</text>

    <rect x="86" y="394" width="52" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="112" y="412" fill="#334155">"The"</text>

    <rect x="144" y="394" width="58" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="173" y="412" font-weight="700" fill="#1e40af">[MASK]</text>

    <rect x="208" y="394" width="52" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="234" y="412" font-weight="700" fill="#92400e">[SEP]</text>

    <rect x="266" y="394" width="52" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="292" y="412" fill="#334155">"It"</text>

    <rect x="324" y="394" width="58" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="353" y="412" fill="#334155">"barks"</text>
  </g>

  <!-- 3 Summed Embeddings Bar -->
  <rect x="28" y="338" width="354" height="40" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="205" y="354" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e">2. Sum 3 Embeddings: E_token + E_pos + E_segment</text>
  <text x="205" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#b45309">Segment A (E_A): [CLS]..[SEP]  |  Segment B (E_B): "It".."barks"</text>

  <!-- Bidirectional Encoder Stack -->
  <rect x="28" y="246" width="354" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="205" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">3. Bidirectional Transformer Encoder (×12 Layers)</text>
  <text x="205" y="286" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#1d4ed8">NO Causal Mask — Every token attends to Left AND Right!</text>
  <text x="205" y="304" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">Shape In: [B, T, 768]  ──►  Shape Out: [B, T, 768]</text>

  <!-- Final Contextual Hidden States h0..h5 -->
  <g font-family="monospace" font-size="10.5" text-anchor="middle">
    <rect x="28" y="186" width="52" height="36" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="54" y="202" font-weight="700" fill="#5b21b6">h₀</text>
    <text x="54" y="216" font-size="9" fill="#6d28d9">[CLS]</text>

    <rect x="86" y="186" width="52" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <text x="112" y="202" fill="#94a3b8">h₁</text>
    <text x="112" y="216" font-size="8.5" fill="#94a3b8">y=-100</text>

    <rect x="144" y="186" width="58" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="173" y="202" font-weight="700" fill="#1e40af">h₂</text>
    <text x="173" y="216" font-size="9" fill="#1d4ed8">[MASK]</text>

    <rect x="208" y="186" width="52" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <text x="234" y="202" fill="#94a3b8">h₃</text>
    <text x="234" y="216" font-size="8.5" fill="#94a3b8">y=-100</text>

    <rect x="266" y="186" width="52" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <text x="292" y="202" fill="#94a3b8">h₄</text>
    <text x="292" y="216" font-size="8.5" fill="#94a3b8">y=-100</text>

    <rect x="324" y="186" width="58" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <text x="353" y="202" fill="#94a3b8">h₅</text>
    <text x="353" y="216" font-size="8.5" fill="#94a3b8">y=-100</text>
  </g>

  <!-- Routing arrows to NSP and MLM heads -->
  <line x1="54" y1="186" x2="88" y2="146" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#b-arr-purple)"/>
  <line x1="173" y1="186" x2="265" y2="146" stroke="#2563eb" stroke-width="1.8" marker-end="url(#b-arr-blue)"/>

  <!-- Temporary Pretraining Heads (Top of Left Panel) -->
  <rect x="28" y="88" width="150" height="56" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="103" y="106" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#5b21b6">NSP Head (Pos 0 only)</text>
  <text x="103" y="121" text-anchor="middle" font-family="monospace" font-size="10" fill="#6d28d9">Linear(768 → 2)</text>
  <text x="103" y="136" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#5b21b6">CE: IsNext vs NotNext</text>

  <rect x="190" y="88" width="192" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="286" y="106" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">MLM Head (Masked Pos only)</text>
  <text x="286" y="121" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d4ed8">Linear(768 → 30,522 vocab)</text>
  <text x="286" y="136" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#1e3a8a">CE: Predict "dog" at pos 2</text>

  <!-- RIGHT PANEL: PHASE 2 DOWNSTREAM ADAPTATION -->
  <rect x="412" y="42" width="372" height="412" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="412" y="42" width="372" height="32" rx="8" fill="#d1fae5"/>
  <text x="598" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Phase 2: Discard MLM/NSP Heads → 3 Downstream Paths</text>

  <!-- Sub-card A: Sequence Classification -->
  <rect x="428" y="86" width="340" height="106" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="598" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">Path A: Sequence Classification (Sentiment / NLI / Reranker)</text>
  <text x="598" y="123" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">Use ONLY the first token vector h₀ ([CLS]) — it attended to full text!</text>
  <rect x="455" y="134" width="286" height="46" rx="5" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="598" y="152" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#5b21b6">h₀ ([CLS]) ──► Linear(768 → num_classes)</text>
  <text x="598" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#6d28d9">Loss: Cross-Entropy over C classes (Notice: BERT uses h₀; GPT uses h_{-1})</text>

  <!-- Sub-card B: Token Classification / Extractive QA -->
  <rect x="428" y="204" width="340" height="110" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="598" y="223" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Path B: Token-Level Tasks (NER / POS / Extractive QA)</text>
  <text x="598" y="241" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">Use EVERY token vector [h₁, h₂, ..., h_T] simultaneously!</text>
  <rect x="455" y="252" width="286" height="50" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="598" y="270" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#1e40af">NER: Every h_t ──► Linear(768 → num_tags)</text>
  <text x="598" y="288" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">QA:  Every h_t ──► Linear(768 → 2) [start, end]</text>

  <!-- Sub-card C: Embedding Model (Bi-Encoder) -->
  <rect x="428" y="326" width="340" height="114" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="598" y="345" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">Path C: Sentence Embedding Model (Bi-Encoder for RAG)</text>
  <text x="598" y="363" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">No classification head! Pool all tokens into 1 unit vector e ∈ ℝ^768:</text>
  <rect x="455" y="374" width="286" height="52" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="598" y="392" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#047857">[h₁..h_T] ──► Mean Pool + L2 Norm ──► e ∈ ℝ^768</text>
  <text x="598" y="412" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#065f46">Fine-tune on (query, passage⁺) pairs with InfoNCE Contrastive Loss</text>
</svg>