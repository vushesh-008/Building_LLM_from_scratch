<svg width="100%" viewBox="0 0 780 390" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Embedding Training: Anisotropy vs Contrastive Unit Hypersphere, InfoNCE Matrix, and Matryoshka Loss</title>
  <desc>Three-part visual showing (1) how Contrastive InfoNCE transforms BERT's anisotropic vector cone into an isotropic unit hypersphere, (2) the N by N cosine similarity matrix for InfoNCE cross-entropy, and (3) Matryoshka nested dimension prefixes.</desc>
  <defs>
    <marker id="vec-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vec-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vec-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="780" height="390" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- PANEL 1 (TOP LEFT): Raw BERT Anisotropic Cone -->
  <rect x="20" y="18" width="235" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="137" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#334155">1A. Raw BERT (MLM Only)</text>
  <text x="137" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#dc2626">Anisotropic Cone (High cos sim everywhere)</text>

  <!-- Axes & Cone -->
  <circle cx="137" cy="145" r="68" fill="none" stroke="#e2e8f0" stroke-dasharray="3,3"/>
  <line x1="55" y1="145" x2="219" y2="145" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="137" y1="68" x2="137" y2="222" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Shaded narrow cone -->
  <path d="M137 145 L178 86 A70 70 0 0 1 198 112 Z" fill="#fee2e2" opacity="0.8"/>
  <line x1="137" y1="145" x2="176" y2="89" stroke="#dc2626" stroke-width="1.5" marker-end="url(#vec-red)"/>
  <line x1="137" y1="145" x2="185" y2="97" stroke="#dc2626" stroke-width="1.5" marker-end="url(#vec-red)"/>
  <line x1="137" y1="145" x2="192" y2="106" stroke="#dc2626" stroke-width="1.5" marker-end="url(#vec-red)"/>
  <line x1="137" y1="145" x2="196" y2="114" stroke="#dc2626" stroke-width="1.5" marker-end="url(#vec-red)"/>
  <text x="137" y="234" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Unrelated texts cluster in narrow cone</text>

  <!-- PANEL 2 (TOP MIDDLE): Contrastive Unit Hypersphere -->
  <rect x="272" y="18" width="235" height="230" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="390" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#065f46">1B. After InfoNCE Fine-Tuning</text>
  <text x="390" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#059669">Isotropic Unit Hypersphere (||e||₂ = 1)</text>

  <circle cx="390" cy="145" r="68" fill="#ecfdf5" fill-opacity="0.5" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="308" y1="145" x2="472" y2="145" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="390" y1="68" x2="390" y2="222" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Query q and Positive d+ pulled together -->
  <line x1="390" y1="145" x2="438" y2="97" stroke="#2563eb" stroke-width="2" marker-end="url(#vec-blue)"/>
  <text x="450" y="92" font-family="monospace" font-size="11" font-weight="700" fill="#1d4ed8">qᵢ</text>
  <line x1="390" y1="145" x2="448" y2="112" stroke="#059669" stroke-width="2" marker-end="url(#vec-green)"/>
  <text x="462" y="114" font-family="monospace" font-size="11" font-weight="700" fill="#047857">dᵢ⁺</text>

  <!-- Negatives pushed apart -->
  <line x1="390" y1="145" x2="328" y2="115" stroke="#dc2626" stroke-width="1.5" marker-end="url(#vec-red)"/>
  <text x="315" y="112" font-family="monospace" font-size="10" fill="#b91c1c">d₁⁻</text>
  <line x1="390" y1="145" x2="345" y2="196" stroke="#dc2626" stroke-width="1.5" marker-end="url(#vec-red)"/>
  <text x="332" y="206" font-family="monospace" font-size="10" fill="#b91c1c">d₂⁻</text>
  <line x1="390" y1="145" x2="430" y2="200" stroke="#dc2626" stroke-width="1.5" marker-end="url(#vec-red)"/>
  <text x="442" y="208" font-family="monospace" font-size="10" fill="#b91c1c">d₃⁻</text>

  <text x="390" y="234" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#047857">Pull (qᵢ, dᵢ⁺) close; push negatives apart</text>

  <!-- PANEL 3 (TOP RIGHT): InfoNCE N x N Matrix -->
  <rect x="525" y="18" width="235" height="230" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="642" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">2. InfoNCE = CE on Sim Matrix</text>
  <text x="642" y="53" text-anchor="middle" font-family="monospace" font-size="10" fill="#2563eb">S_ij = cos(q_i, d_j) / τ</text>

  <!-- Column headers -->
  <g font-family="monospace" font-size="10" fill="#475569" text-anchor="middle">
    <text x="595" y="76">d₀⁺</text>
    <text x="635" y="76">d₁⁺</text>
    <text x="675" y="76">d₂⁺</text>
    <text x="715" y="76">d₃⁺</text>
  </g>
  <!-- Row headers -->
  <g font-family="monospace" font-size="10" fill="#475569" text-anchor="end">
    <text x="568" y="102">q₀</text>
    <text x="568" y="136">q₁</text>
    <text x="568" y="170">q₂</text>
    <text x="568" y="204">q₃</text>
  </g>

  <!-- 4x4 Grid -->
  <!-- Row 0 -->
  <rect x="577" y="84" width="36" height="28" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="595" y="102" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#065f46">+s₀₀</text>
  <rect x="617" y="84" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="635" y="102" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₀₁</text>
  <rect x="657" y="84" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="675" y="102" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₀₂</text>
  <rect x="697" y="84" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="715" y="102" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₀₃</text>

  <!-- Row 1 -->
  <rect x="577" y="118" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="595" y="136" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₁₀</text>
  <rect x="617" y="118" width="36" height="28" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="635" y="136" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#065f46">+s₁₁</text>
  <rect x="657" y="118" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="675" y="136" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₁₂</text>
  <rect x="697" y="118" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="715" y="136" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₁₃</text>

  <!-- Row 2 -->
  <rect x="577" y="152" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="595" y="170" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₂₀</text>
  <rect x="617" y="152" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="635" y="170" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₂₁</text>
  <rect x="657" y="152" width="36" height="28" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="675" y="170" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#065f46">+s₂₂</text>
  <rect x="697" y="152" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="715" y="170" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₂₃</text>

  <!-- Row 3 -->
  <rect x="577" y="186" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="595" y="204" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₃₀</text>
  <rect x="617" y="186" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="635" y="204" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₃₁</text>
  <rect x="657" y="186" width="36" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="675" y="204" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">-s₃₂</text>
  <rect x="697" y="186" width="36" height="28" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="715" y="204" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#065f46">+s₃₃</text>

  <text x="642" y="234" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#1e3a8a">Target class for row i = diagonal index i</text>

  <!-- BOTTOM PANEL: Matryoshka Representation Learning (MRL) -->
  <rect x="20" y="262" width="740" height="112" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="390" y="283" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#4c1d95">3. Matryoshka Representation Learning (MRL): Multi-Prefix InfoNCE Loss</text>

  <!-- Nested Dimension Bar -->
  <rect x="45" y="296" width="85" height="32" rx="4" fill="#5b21b6" stroke="#4c1d95"/>
  <text x="87" y="316" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">0 .. 64</text>

  <rect x="130" y="296" width="95" height="32" rx="0" fill="#7c3aed" stroke="#4c1d95"/>
  <text x="177" y="316" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">64 .. 128</text>

  <rect x="225" y="296" width="130" height="32" rx="0" fill="#8b5cf6" stroke="#4c1d95"/>
  <text x="290" y="316" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">128 .. 256</text>

  <rect x="355" y="296" width="165" height="32" rx="0" fill="#a78bfa" stroke="#4c1d95"/>
  <text x="437" y="316" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e1b4b">256 .. 512</text>

  <rect x="520" y="296" width="215" height="32" rx="4" fill="#ddd6fe" stroke="#4c1d95"/>
  <text x="627" y="316" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e1b4b">512 .. 1024</text>

  <text x="390" y="348" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#4c1d95">L_MRL = L_InfoNCE(e[:64]) + L_InfoNCE(e[:128]) + L_InfoNCE(e[:256]) + L_InfoNCE(e[:512]) + L_InfoNCE(e[:1024])</text>
  <text x="390" y="364" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Forces coarse, high-importance semantics into earliest dimensions so vectors can be sliced at inference time</text>
</svg>
