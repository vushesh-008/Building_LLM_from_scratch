<svg width="100%" viewBox="0 0 680 223.23" role="img" style="" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">FlashAttention tiling between HBM and SRAM</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Instead of materializing the full N by N attention matrix in large slow HBM memory, small tiles of Q, K, and V are loaded into fast small SRAM, where partial attention is computed and accumulated, and only the final output is written back to HBM, so the full attention matrix never exists in slow memory at once.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><mask id="imagine-text-gaps-2r9i53" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="223.23" fill="white"/><rect x="109.53490447998047" y="38.99978256225586" width="40.93019485473633" height="21.500268936157227" fill="black" rx="2"/><rect x="96.70267486572266" y="58.99981689453125" width="66.59465026855469" height="19.00023078918457" fill="black" rx="2"/><rect x="71.8702621459961" y="95.99981689453125" width="116.25947570800781" height="19.00023078918457" fill="black" rx="2"/><rect x="74.85468292236328" y="115.99981689453125" width="110.29063415527344" height="19.00023078918457" fill="black" rx="2"/><rect x="71.10071563720703" y="133.99981689453125" width="117.7985610961914" height="19.00023078918457" fill="black" rx="2"/><rect x="71.35462951660156" y="151.99981689453125" width="117.29074096679688" height="19.00023078918457" fill="black" rx="2"/><rect x="228.79652404785156" y="51.99981689453125" width="52.40693283081055" height="19.00023078918457" fill="black" rx="2"/><rect x="330.1559143066406" y="58.999786376953125" width="49.688140869140625" height="21.500268936157227" fill="black" rx="2"/><rect x="293.3702087402344" y="77.99981689453125" width="123.25958251953125" height="19.00023078918457" fill="black" rx="2"/><rect x="221.67478942871094" y="140.99981689453125" width="136.65042114257812" height="19.00023078918457" fill="black" rx="2"/><rect x="421.08544921875" y="51.99981689453125" width="67.82904434204102" height="19.00023078918457" fill="black" rx="2"/><rect x="518.5345458984375" y="58.999786376953125" width="92.93099212646484" height="21.500268936157227" fill="black" rx="2"/><rect x="517.5227661132812" y="77.99981689453125" width="94.95446014404297" height="19.00023078918457" fill="black"