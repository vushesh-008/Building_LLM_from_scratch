<svg width="100%" viewBox="0 0 780 310" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>BatchNorm vs LayerNorm vs RMSNorm in Transformers</title>
  <desc>Three-panel comparison showing (1) BatchNorm normalizing vertically across batch items (fails for variable sequence lengths), (2) LayerNorm normalizing horizontally across each single token's d_model features (zero-centering + variance scaling), and (3) RMSNorm skipping mean subtraction and scaling only by Root Mean Square.</desc>

  <rect width="780" height="310" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="390" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e293b">Normalization in Transformers: BatchNorm vs. LayerNorm vs. RMSNorm</text>

  <!-- PANEL 1: BatchNorm -->
  <rect x="20" y="46" width="235" height="244" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="137" y="66" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">1. BatchNorm (CNNs — Bad for NLP)</text>
  <text x="137" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#b91c1c">Normalizes DOWN column across Batch</text>

  <!-- Grid showing vertical column highlighted -->
  <g font-family="monospace" font-size="9.5" fill="#64748b">
    <text x="148" y="102" text-anchor="middle">d₁  d₂  d₃  d₄</text>
    <text x="74" y="122" text-anchor="end">Token 1 (B₁)</text>
    <text x="74" y="148" text-anchor="end">Token 1 (B₂)</text>
    <text x="74" y="174" text-anchor="end">Token 1 (B₃)</text>
  </g>
  <!-- Highlighted vertical column d1 -->
  <rect x="82" y="108" width="28" height="78" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="115" y="108" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="148" y="108" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="181" y="108" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>

  <rect x="115" y="136" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="148" y="136" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="181" y="136" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>

  <rect x="115" y="164" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="148" y="164" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="181" y="164" width="28" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>

  <text x="137" y="210" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#991b1b">✗ Mixes different sentences</text>
  <text x="137" y="226" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#991b1b">✗ Breaks on padding &amp; batch_size=1</text>
  <text x="137" y="242" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#991b1b">✗ Needs running_mean at inference</text>

  <!-- PANEL 2: LayerNorm -->
  <rect x="272" y="46" width="235" height="244" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="390" y="66" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">2. LayerNorm (GPT-2 / BERT)</text>
  <text x="390" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#2563eb">Normalizes ACROSS single token's features</text>

  <g font-family="monospace" font-size="9.5" fill="#64748b">
    <text x="398" y="102" text-anchor="middle">d₁  d₂  d₃  d₄ (d_model)</text>
    <text x="326" y="122" text-anchor="end">Token 1</text>
    <text x="326" y="148" text-anchor="end">Token 2</text>
    <text x="326" y="174" text-anchor="end">Token 3</text>
  </g>

  <!-- Highlighted horizontal row Token 1 -->
  <rect x="334" y="108" width="128" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="334" y="136" width="128" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="334" y="164" width="128" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd"/>

  <text x="390" y="206" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#1e3a8a">LN(x) = γ · (x - μ) / √(σ² + ε) + β</text>
  <text x="390" y="226" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#1e40af">✓ 100% independent per token</text>
  <text x="390" y="242" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#1e40af">✓ Computes BOTH Mean μ and Var σ²</text>
  <text x="390" y="258" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#64748b">Params: 2 × d_model (γ and β)</text>

  <!-- PANEL 3: RMSNorm -->
  <rect x="525" y="46" width="235" height="244" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="642" y="66" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">3. RMSNorm (LLaMA / Qwen / Gemma)</text>
  <text x="642" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#059669">Same per-token axis, drops Mean μ &amp; β!</text>

  <g font-family="monospace" font-size="9.5" fill="#64748b">
    <text x="650" y="102" text-anchor="middle">d₁  d₂  d₃  d₄ (d_model)</text>
    <text x="578" y="122" text-anchor="end">Token 1</text>
    <text x="578" y="148" text-anchor="end">Token 2</text>
    <text x="578" y="174" text-anchor="end">Token 3</text>
  </g>

  <rect x="586" y="108" width="128" height="22" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <rect x="586" y="136" width="128" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="586" y="164" width="128" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>

  <text x="642" y="206" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#065f46">RMSNorm(x) = γ · x / √( (1/d)∑xᵢ² + ε )</text>
  <text x="642" y="226" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#047857">✓ Skips mean μ subtraction (1 pass!)</text>
  <text x="642" y="242" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#047857">✓ ~7–10% faster GPU kernel bandwidth</text>
  <text x="642" y="258" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#64748b">Params: 1 × d_model (γ only, no β)</text>
</svg>