<svg width="100%" viewBox="0 0 780 310" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Causal Masking Pipeline: Raw Scores to -Infinity Mask to Row-Wise Softmax</title>
  <desc>Three-stage matrix pipeline for causal self-attention: (1) Raw dot-product scores QK^T / sqrt(d_k), (2) Upper-triangular future positions filled with -infinity via torch.triu, and (3) Row-wise Softmax where exp(-infinity) = 0 and each row sums to 1.0.</desc>
  <defs>
    <marker id="cm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="780" height="310" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="390" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e293b">Causal Masking Pipeline: Why We Mask With -∞ BEFORE Softmax</text>

  <!-- STAGE 1: Raw Scaled Scores -->
  <rect x="20" y="46" width="220" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="130" y="66" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155">1. Scaled Scores (QKᵀ / √d_k)</text>
  <text x="130" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Future tokens leak in upper triangle</text>

  <!-- Headers -->
  <g font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="95" y="102">k₁(The)</text>
    <text x="145" y="102">k₂(cat)</text>
    <text x="195" y="102">k₃(sat)</text>
  </g>
  <g font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">
    <text x="66" y="128">q₁(The)</text>
    <text x="66" y="166">q₂(cat)</text>
    <text x="66" y="204">q₃(sat)</text>
  </g>

  <!-- Matrix 1 Cells -->
  <rect x="72" y="110" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="95" y="129" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">2.0</text>
  <rect x="122" y="110" width="46" height="30" rx="4" fill="#fee2e2" stroke="#f87171" stroke-dasharray="3,2"/>
  <text x="145" y="129" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">1.5</text>
  <rect x="172" y="110" width="46" height="30" rx="4" fill="#fee2e2" stroke="#f87171" stroke-dasharray="3,2"/>
  <text x="195" y="129" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">0.8</text>

  <rect x="72" y="148" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="95" y="167" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">1.2</text>
  <rect x="122" y="148" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="145" y="167" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">0.8</text>
  <rect x="172" y="148" width="46" height="30" rx="4" fill="#fee2e2" stroke="#f87171" stroke-dasharray="3,2"/>
  <text x="195" y="167" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">2.1</text>

  <rect x="72" y="186" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="95" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">0.5</text>
  <rect x="122" y="186" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="145" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">1.9</text>
  <rect x="172" y="186" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="195" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">0.5</text>

  <text x="130" y="238" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#b91c1c">Red dashed = future tokens (j &gt; i)</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="244" y1="150" x2="274" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#cm-arr)"/>

  <!-- STAGE 2: Upper-Triangle Masked with -inf -->
  <rect x="280" y="46" width="220" height="210" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="390" y="66" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">2. masked_fill(triu, -∞)</text>
  <text x="390" y="82" text-anchor="middle" font-family="monospace" font-size="10" fill="#2563eb">torch.triu(ones, diagonal=1)</text>

  <g font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="345" y="102">k₁</text>
    <text x="395" y="102">k₂</text>
    <text x="445" y="102">k₃</text>
  </g>

  <rect x="322" y="110" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="345" y="129" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">2.0</text>
  <rect x="372" y="110" width="46" height="30" rx="4" fill="#1e293b"/>
  <text x="395" y="129" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#f87171">-∞</text>
  <rect x="422" y="110" width="46" height="30" rx="4" fill="#1e293b"/>
  <text x="445" y="129" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#f87171">-∞</text>

  <rect x="322" y="148" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="345" y="167" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">1.2</text>
  <rect x="372" y="148" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="395" y="167" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">0.8</text>
  <rect x="422" y="148" width="46" height="30" rx="4" fill="#1e293b"/>
  <text x="445" y="167" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#f87171">-∞</text>

  <rect x="322" y="186" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="345" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">0.5</text>
  <rect x="372" y="186" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="395" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">1.9</text>
  <rect x="422" y="186" width="46" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="445" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">0.5</text>

  <text x="390" y="238" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#1e3a8a">exp(-∞) = 0 in Softmax!</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="504" y1="150" x2="534" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#cm-arr)"/>

  <!-- STAGE 3: Row-wise Softmax Attention Weights -->
  <rect x="540" y="46" width="220" height="210" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="650" y="66" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">3. After Row-Wise Softmax</text>
  <text x="650" y="82" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#047857">Every row sums to exactly 1.00</text>

  <g font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="600" y="102">k₁</text>
    <text x="650" y="102">k₂</text>
    <text x="700" y="102">k₃</text>
  </g>

  <rect x="577" y="110" width="46" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="129" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">1.00</text>
  <rect x="627" y="110" width="46" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="650" y="129" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">0.00</text>
  <rect x="677" y="110" width="46" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="700" y="129" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">0.00</text>

  <rect x="577" y="148" width="46" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="167" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">0.60</text>
  <rect x="627" y="148" width="46" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="167" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">0.40</text>
  <rect x="677" y="148" width="46" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="700" y="167" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">0.00</text>

  <rect x="577" y="186" width="46" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">0.16</text>
  <rect x="627" y="186" width="46" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">0.68</text>
  <rect x="677" y="186" width="46" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="205" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">0.16</text>

  <text x="650" y="238" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#047857">Zero future leakage + valid probabilities</text>

  <!-- Bottom Note -->
  <text x="390" y="286" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">If you multiplied by 0 AFTER Softmax instead of setting -∞ BEFORE Softmax, rows wouldn't sum to 1.0 and future scores would still pollute the denominator!</text>
</svg>