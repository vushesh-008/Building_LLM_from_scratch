<svg width="100%" viewBox="0 0 780 430" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Evolution of Deep Learning Optimizers: From SGD to AdamW</title>
  <desc>Architecture diagram showing how Vanilla SGD splits into the First Moment branch (Momentum and Nesterov, smoothing direction) and the Second Moment branch (AdaGrad and RMSProp, adapting step size per parameter), which combine with Bias Correction and Decoupled Weight Decay to form AdamW.</desc>
  <defs>
    <marker id="opt-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="780" height="430" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="390" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e293b">The Optimizer Family Tree: How Momentum + RMSProp + Weight Decay Form AdamW</text>

  <!-- Root: Mini-Batch SGD -->
  <rect x="255" y="42" width="270" height="48" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.2"/>
  <text x="390" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Mini-Batch SGD</text>
  <text x="390" y="78" text-anchor="middle" font-family="monospace" font-size="11" fill="#475569">w_t = w_{t-1} - α · g_t   (Same α for all params, oscillates)</text>

  <!-- Split Lines -->
  <line x1="390" y1="90" x2="390" y2="104" stroke="#64748b" stroke-width="1.5"/>
  <line x1="195" y1="104" x2="585" y2="104" stroke="#64748b" stroke-width="1.5"/>
  <line x1="195" y1="104" x2="195" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#opt-arr)"/>
  <line x1="585" y1="104" x2="585" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#opt-arr)"/>

  <!-- LEFT BRANCH: 1st Moment (Direction / Velocity) -->
  <rect x="25" y="124" width="340" height="162" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="195" y="144" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Branch 1: First Moment (Fixes Direction)</text>
  <text x="195" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#1d4ed8">Exponential Moving Average of Gradients (Velocity)</text>

  <!-- Classical Momentum Box -->
  <rect x="42" y="170" width="306" height="46" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="195" y="187" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Momentum (β₁ ≈ 0.9)</text>
  <text x="195" y="204" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">m_t = β₁·m_{t-1} + (1 - β₁)·g_t</text>

  <!-- Nesterov Box -->
  <rect x="42" y="226" width="306" height="48" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="195" y="243" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Nesterov (NAG — "Look Before You Leap")</text>
  <text x="195" y="261" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#475569">Computes gradient at look-ahead: ∇J(w - α·β₁·m_{t-1})</text>

  <!-- RIGHT BRANCH: 2nd Moment (Adaptive Step Size) -->
  <rect x="415" y="124" width="340" height="162" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="585" y="144" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Branch 2: Second Moment (Fixes Step Size)</text>
  <text x="585" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#047857">Per-Parameter Scaling by Squared Gradients</text>

  <!-- AdaGrad Box -->
  <rect x="432" y="170" width="306" height="46" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="585" y="187" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">AdaGrad (Cumulative Sum → Dies Out)</text>
  <text x="585" y="204" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">v_t = v_{t-1} + g_t²   (v_t → ∞ so step → 0)</text>

  <!-- RMSProp Box -->
  <rect x="432" y="226" width="306" height="48" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="585" y="243" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">RMSProp (Leaky Average, β₂ ≈ 0.999 or 0.95)</text>
  <text x="585" y="261" text-anchor="middle" font-family="monospace" font-size="11" fill="#047857">v_t = β₂·v_{t-1} + (1 - β₂)·g_t²</text>

  <!-- Merge Lines into Adam / AdamW -->
  <line x1="195" y1="286" x2="195" y2="302" stroke="#64748b" stroke-width="1.5"/>
  <line x1="585" y1="286" x2="585" y2="302" stroke="#64748b" stroke-width="1.5"/>
  <line x1="195" y1="302" x2="585" y2="302" stroke="#64748b" stroke-width="1.5"/>
  <line x1="390" y1="302" x2="390" y2="318" stroke="#64748b" stroke-width="1.8" marker-end="url(#opt-arr)"/>

  <!-- Bottom Merged Box: Adam & AdamW -->
  <rect x="45" y="322" width="690" height="94" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="390" y="343" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Adam &amp; AdamW (The Modern Transformer / LLM Standard)</text>
  <text x="390" y="365" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#93c5fd">Bias Correction:  m̂_t = m_t / (1 - β₁ᵗ)     ,     v̂_t = v_t / (1 - β₂ᵗ)</text>
  <text x="390" y="386" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">AdamW Update:   w_t = (1 - α·λ)·w_{t-1}  -  α · m̂_t / (√v̂_t + ε)</text>
  <text x="390" y="404" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">Decoupled Weight Decay (λ) shrinks weights directly without polluting the adaptive √v̂_t denominator</text>
</svg>