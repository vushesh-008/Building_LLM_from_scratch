<svg width="100%" viewBox="0 0 780 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Instruction SFT Token Alignment and -100 Loss Masking</title>
  <desc>Step-by-step diagram showing how inputs keep valid token IDs (including 50256 for padding) for nn.Embedding, while shifted targets keep only the response tokens and the first 50256 EOS token and mask instruction and extra padding tokens with -100.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="780" height="340" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="390" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e293b">Instruction SFT Batch Collation: Why -100 Is Only in Targets (Never in Inputs)</text>

  <!-- Row Labels -->
  <text x="18" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#334155">1. inputs (x)</text>
  <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Fed to nn.Embedding</text>
  <text x="18" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#2563eb">(All valid IDs 0..50256)</text>

  <text x="18" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#334155">2. Raw shifted y</text>
  <text x="18" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">padded[1:] before mask</text>

  <text x="18" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#334155">3. Masked targets (y)</text>
  <text x="18" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Fed to F.cross_entropy</text>
  <text x="18" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#dc2626">(ignore_index = -100)</text>

  <!-- Column Headers (Position 0..6) -->
  <g font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="200" y="48">pos 0</text>
    <text x="285" y="48">pos 1</text>
    <text x="370" y="48">pos 2</text>
    <text x="455" y="48">pos 3</text>
    <text x="540" y="48">pos 4</text>
    <text x="625" y="48">pos 5</text>
    <text x="710" y="48">pos 6</text>
  </g>

  <!-- ROW 1: INPUTS (x) -->
  <!-- I1, I2, I3 -->
  <g>
    <rect x="162" y="56" width="76" height="48" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="200" y="75" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0369a1">101 (I₁)</text>
    <text x="200" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#0284c7">"Translate"</text>

    <rect x="247" y="56" width="76" height="48" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="285" y="75" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0369a1">102 (I₂)</text>
    <text x="285" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#0284c7">"'Hello'"</text>

    <rect x="332" y="56" width="76" height="48" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="370" y="75" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0369a1">103 (I₃)</text>
    <text x="370" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#0284c7">"Resp:"</text>

    <!-- R1, R2 -->
    <rect x="417" y="56" width="76" height="48" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="455" y="75" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">201 (R₁)</text>
    <text x="455" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#16a34a">"Bon"</text>

    <rect x="502" y="56" width="76" height="48" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="540" y="75" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">202 (R₂)</text>
    <text x="540" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#16a34a">"jour"</text>

    <!-- PAD 50256 in inputs -->
    <rect x="587" y="56" width="76" height="48" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="625" y="75" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#334155">50256</text>
    <text x="625" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">PAD / EOS</text>

    <rect x="672" y="56" width="76" height="48" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="710" y="75" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#334155">50256</text>
    <text x="710" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">PAD / EOS</text>
  </g>

  <!-- Arrows from Row 1 to Row 2 -->
  <g stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)">
    <line x1="200" y1="104" x2="200" y2="144"/>
    <line x1="285" y1="104" x2="285" y2="144"/>
    <line x1="370" y1="104" x2="370" y2="144"/>
    <line x1="455" y1="104" x2="455" y2="144"/>
    <line x1="540" y1="104" x2="540" y2="144"/>
    <line x1="625" y1="104" x2="625" y2="144"/>
    <line x1="710" y1="104" x2="710" y2="144"/>
  </g>

  <!-- ROW 2: RAW SHIFTED TARGETS -->
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <rect x="162" y="148" width="76" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="200" y="170" fill="#64748b">102 (I₂)</text>

    <rect x="247" y="148" width="76" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="285" y="170" fill="#64748b">103 (I₃)</text>

    <rect x="332" y="148" width="76" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="370" y="170" fill="#15803d" font-weight="700">201 (R₁)</text>

    <rect x="417" y="148" width="76" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="455" y="170" fill="#15803d" font-weight="700">202 (R₂)</text>

    <rect x="502" y="148" width="76" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="540" y="170" fill="#0f766e" font-weight="700">50256 (1st)</text>

    <rect x="587" y="148" width="76" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="625" y="170" fill="#64748b">50256 (2nd)</text>

    <rect x="672" y="148" width="76" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="710" y="170" fill="#64748b">50256 (3rd)</text>
  </g>

  <!-- Arrows from Row 2 to Row 3 -->
  <g stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)">
    <line x1="200" y1="184" x2="200" y2="226"/>
    <line x1="285" y1="184" x2="285" y2="226"/>
    <line x1="370" y1="184" x2="370" y2="226"/>
    <line x1="455" y1="184" x2="455" y2="226"/>
    <line x1="540" y1="184" x2="540" y2="226"/>
    <line x1="625" y1="184" x2="625" y2="226"/>
    <line x1="710" y1="184" x2="710" y2="226"/>
  </g>

  <!-- ROW 3: FINAL MASKED TARGETS (y) -->
  <g>
    <!-- Masked Instruction (-100) -->
    <rect x="162" y="230" width="76" height="48" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="200" y="250" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#b91c1c">-100</text>
    <text x="200" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#dc2626">Mask Prompt</text>

    <rect x="247" y="230" width="76" height="48" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="285" y="250" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#b91c1c">-100</text>
    <text x="285" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#dc2626">Mask Prompt</text>

    <!-- Supervised Response + 1st EOS -->
    <rect x="332" y="230" width="76" height="48" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
    <text x="370" y="250" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065f46">201 (R₁)</text>
    <text x="370" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#047857">CE Loss ✓</text>

    <rect x="417" y="230" width="76" height="48" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
    <text x="455" y="250" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065f46">202 (R₂)</text>
    <text x="455" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#047857">CE Loss ✓</text>

    <rect x="502" y="230" width="76" height="48" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/>
    <text x="540" y="250" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#115e59">50256</text>
    <text x="540" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0f766e">KEEP 1st EOS ✓</text>

    <!-- Masked Extra Padding (-100) -->
    <rect x="587" y="230" width="76" height="48" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="625" y="250" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#b91c1c">-100</text>
    <text x="625" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#dc2626">Mask Pad</text>

    <rect x="672" y="230" width="76" height="48" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="710" y="250" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#b91c1c">-100</text>
    <text x="710" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#dc2626">Mask Pad</text>
  </g>

  <!-- Bottom Bracket Annotations -->
  <text x="242" y="308" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#b91c1c">0 Loss / 0 Gradient (Context only)</text>
  <text x="455" y="308" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857">Active Supervision (Learns answer + when to stop)</text>
  <text x="667" y="308" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#b91c1c">0 Loss / 0 Gradient (Padding ignored)</text>
</svg>
